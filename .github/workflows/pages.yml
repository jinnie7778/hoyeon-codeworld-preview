name: Deploy game preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoyeon-preview-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package the Vite build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Verify public artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/lesson01/index.html
          test -f site/classroom/index.html
          test -n "$(find site/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$(find site/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
          grep -q '/hoyeon-codeworld-preview/assets/' site/index.html
          grep -q '/hoyeon-codeworld-preview/assets/' site/classroom/index.html
          unexpected=$(find site -type f | grep -Ev '^site/(index\.html|classroom/index\.html|lesson01/index\.html|assets/[A-Za-z0-9_-]+\.(js|css))$' || true)
          test -z "$unexpected"
          if grep -Erq 'sb_secret_[A-Za-z0-9_-]{16,}|BEGIN .*PRIVATE KEY|github_pat_[A-Za-z0-9_]{20,}|[#@] sourceMappingURL=' site; then echo 'Sensitive artifact pattern detected'; exit 1; fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
